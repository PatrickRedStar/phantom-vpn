[package]
name = "client-core-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
phantom-core        = { path = "../core" }
phantom-client-common = { path = "../client-common" }
ghoststream-gui-ipc = { path = "../gui-ipc" }
tokio               = { version = "1", features = ["full"] }
tokio-util          = { version = "0.7" }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "registry"] }
bytes               = "1"
anyhow              = "1"
once_cell           = "1"
parking_lot         = "0.12"
libc                = "0.2"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
rustls              = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls        = { version = "0.26", default-features = false, features = ["ring"] }

[features]
# OFF by default and must stay off in anything shipped. Enables experiment-only
# escape hatches for the anti-DPI lab harness (docs/knowledge/architecture/dpi-tspu.md):
#   * server-certificate verification bypass on the boring/uTLS fingerprint path,
#     which is a direct violation of ADR 0011.
# Build the harness with `--features lab-overrides`; never enable it in release.yml.
lab-overrides = []
