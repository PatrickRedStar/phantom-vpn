# phantom-relay configuration
#
# Topology invariant:
#   client ─TLS, SNI=tls.nl2.bikini-bottom.com─▶ relay :443 ─raw TCP─▶ exit 89.110.109.128:8443
# The relay never terminates the clients' TLS: it reads the SNI and copies
# bytes. Clients verify the exit's own LE cert (tls.nl2.bikini-bottom.com).
#
# Two deployment modes are supported:
#
# (a) Standalone on :443  — relay owns the public TCP/443 listener, reads SNI,
#     and either passes through to upstream or terminates a fallback HTTPS
#     handshake itself (cert_path/key_path required for this).
#
# (b) Behind nginx stream — nginx already does ssl_preread + SNI routing,
#     and only forwards the right SNI to relay on a loopback port. In that
#     case the fallback inside relay is dead code; you can omit cert_path /
#     key_path entirely and SNI mismatches will simply close. Never run
#     without a fallback cert on a public port: an instant close on a wrong
#     SNI looks like a censor block, not like a website.

# Address relay binds to.
#   Standalone:        "0.0.0.0:443"
#   Behind nginx stream: "127.0.0.1:5443"
listen_addr  = "127.0.0.1:5443"

# Upstream exit (the NL phantom-server). Must include port, and the port is
# :8443 — the exit's :443 (and :22) are filtered from RU networks.
# A hostname works too (resolved on every connection, all addresses tried),
# but it must never resolve back to the relay itself.
upstream_addr = "89.110.109.128:8443"

# SNI that real clients send. ClientHellos with this exact hostname are
# passed through; everything else hits the fallback (or is dropped).
# MUST equal the clients' SNI (the exit's cert name), not the relay's own
# name: a mismatch sends every client to the fallback cert and they all
# fail with BadCertificate.
expected_sni = "tls.nl2.bikini-bottom.com"

# Fallback HTTPS endpoint (Let's Encrypt cert of the relay's own name) shown
# to probes that hit us without the right SNI. Both fields must be set
# together; omit both to disable fallback (drop on mismatch, mode (b) only).
# The files are re-read on every fallback connection — certbot renewals need
# no relay restart.
# cert_path     = "/etc/letsencrypt/live/relay.bikini-bottom.com/fullchain.pem"
# key_path      = "/etc/letsencrypt/live/relay.bikini-bottom.com/privkey.pem"
