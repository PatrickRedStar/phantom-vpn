# phantom-server — пример конфига для bare-metal (server/scripts/deploy.sh).
# Основной путь установки — Docker (docker/server/, ADR 0010): entrypoint сам
# пишет такой же server.toml из .env.
#
# CA и серверный ключ: phantom-keygen --out /opt/phantom-vpn/config --server-name <SNI>
# Клиенты: keys.py или admin API (/api/clients).

[network]
listen_addr = "0.0.0.0:8443"      # только для логов/ссылок; транспорт слушает [h2]
tun_name    = "tun1"              # не tun0 — может быть занят
tun_addr    = "10.7.0.1/24"       # сервер .1, клиенты .2+
tun_mtu     = 1350
wan_iface   = "eth0"              # NAT наружу; закомментировать — без NAT
public_addr = "tls.nl2.example.com:8443"   # адрес в ghs:// ссылках (реле или сам exit)
server_name = "tls.nl2.example.com"        # SNI в ghs:// ссылках

[h2]
listen_addr = "0.0.0.0:8443"

[tls]
# Клиенты всегда проверяют серт сервера (ADR 0011) — нужен публичный (LE).
# После продления certbot должен перезапускать сервис (deploy-hook, см. build.md).
cert_path = "/etc/letsencrypt/live/tls.nl2.example.com/fullchain.pem"
key_path  = "/etc/letsencrypt/live/tls.nl2.example.com/privkey.pem"

# mTLS: CA клиентских сертов + allowlist (перечитывается по SIGHUP).
ca_cert_path         = "/opt/phantom-vpn/config/ca.crt"
allowed_clients_path = "/opt/phantom-vpn/config/clients.json"

# ─── Admin HTTP API ──────────────────────────────────────────────────────────
[admin]
listen_addr     = "10.7.0.1:8080"     # mTLS, только через туннель
bot_listen_addr = "127.0.0.1:8081"    # plain HTTP + Bearer, для Telegram-бота
token           = "REPLACE_ME"        # openssl rand -hex 32
# CA для выпуска клиентских сертов; по умолчанию [tls].ca_cert_path и .key рядом.
# ca_cert_path = "/opt/phantom-vpn/config/ca.crt"
# ca_key_path  = "/opt/phantom-vpn/config/ca.key"
